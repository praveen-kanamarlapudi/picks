name: Picks
options:
  bundleIdPrefix: app.picks
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: NO

targets:
  PicksCore:
    type: framework
    platform: macOS
    sources:
      - Picks/Catalog
      - Picks/Indexer
      - Picks/Shortlist
      - Picks/Support
      - Picks/Export
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.picks.mac.core
        PRODUCT_NAME: PicksCore
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        ENABLE_HARDENED_RUNTIME: NO

  Picks:
    type: application
    platform: macOS
    sources:
      - Picks/App
      - Picks/Viewer
      - Picks/Assets.xcassets
    dependencies:
      - target: PicksCore
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.picks.mac
        PRODUCT_NAME: Picks
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Picks/Picks.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Picks
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: Picks/Picks.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true

  PicksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PicksTests
    dependencies:
      - target: PicksCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.picks.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Picks:
    build:
      targets:
        Picks: all
        PicksCore: [build, test]
        PicksTests: [test]
    test:
      targets:
        - PicksTests
