name: Keep
options:
  bundleIdPrefix: app.keep
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: NO

targets:
  KeepCore:
    type: framework
    platform: macOS
    sources:
      - Keep/Catalog
      - Keep/Indexer
      - Keep/Shortlist
      - Keep/Support
      - Keep/Export
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keep.mac.core
        PRODUCT_NAME: KeepCore
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        ENABLE_HARDENED_RUNTIME: NO

  Keep:
    type: application
    platform: macOS
    sources:
      - Keep/App
      - Keep/Viewer
      - Keep/Assets.xcassets
    dependencies:
      - target: KeepCore
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keep.mac
        PRODUCT_NAME: Keep
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Keep/Keep.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Keep
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: Keep/Keep.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true

  KeepTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - KeepTests
    dependencies:
      - target: KeepCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keep.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Keep:
    build:
      targets:
        Keep: all
        KeepCore: [build, test]
        KeepTests: [test]
    test:
      targets:
        - KeepTests
